<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthem Guide - Conversational AI Agent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Anthem Guide Agent</h1>
            <p>Elevance Health Web Guide Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! I'm the Anthem Guide agent, specialized in Elevance Health web guide development. How can I help you today?</p>
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <textarea id="userInput" placeholder="Ask me about Elevance Health web guides..." rows="3"></textarea>
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
