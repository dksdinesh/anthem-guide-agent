<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthem Guide - Conversational AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .user-message .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
        }

        #userInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        #sendButton:hover {
            background: #5568d3;
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e0e0e0;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Anthem Guide Agent</h1>
            <p>Elevance Health Web Guide Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! I'm the Anthem Guide agent, specialized in Elevance Health web guide development. How can I help you today?</p>
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <textarea id="userInput" placeholder="Ask me about Elevance Health web guides..." rows="3"></textarea>
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // Anthem Guide agent knowledge base with real Elevance Health information
        const anthemGuideKnowledge = {
            expertise: [
                "Web Guide Development",
                "Content Management", 
                "Technical Implementation",
                "User Experience",
                "Healthcare Compliance"
            ],
            capabilities: [
                "Creating, updating, and maintaining web-based guides and documentation for Elevance Health services and products",
                "Ensuring accurate, up-to-date, and user-friendly content that aligns with Elevance Health's brand guidelines and regulatory requirements",
                "Assisting with HTML, CSS, JavaScript, and any frontend frameworks used in the web guide implementation",
                "Optimizing the web guide for accessibility, responsiveness, and ease of navigation",
                "Ensuring all content meets healthcare industry standards, HIPAA compliance where applicable, and Elevance Health's specific policies"
            ],
            contact: "dgvc.dinesh@gmail.com",
            knowledgeBase: "https://www.elevancehealth.com/",
            
            // Real Elevance Health information from website
            companyInfo: {
                name: "Elevance Health",
                purpose: "Improving the health of humanity",
                mission: "Elevating whole health and advancing health beyond healthcare",
                description: "A health company dedicated to improving health outcomes, lowering costs, and simplifying experiences",
                approach: "Whole health approach that serves people across their entire health journey and addresses their full range of needs"
            },
            
            services: [
                "Health plans",
                "Clinical solutions",
                "Behavioral health services",
                "Pharmacy solutions",
                "Complex-care solutions"
            ],
            
            keyFocusAreas: [
                "Whole Health & What Drives It",
                "Community Health",
                "Health Equity",
                "Digitally Enabled Healthcare",
                "Consumer-Centered Health System"
            ],
            
            researchAreas: [
                "Physical Drivers of Health",
                "Behavioral Drivers of Health",
                "Social Drivers of Health",
                "Peer-Reviewed Research"
            ],
            
            programs: [
                "Community Pharmacy Total Care (CPTC) program",
                "Advancing Health Together initiative",
                "Whole Health Index",
                "Care Provider Partnership programs"
            ]
        };

        // Function to fetch real-time data from Elevance Health website
        async function fetchElevanceHealthData() {
            try {
                // Note: This may fail due to CORS when running from file:// protocol
                // For full functionality, run the backend server
                const response = await fetch('https://www.elevancehealth.com/');
                const html = await response.text();
                
                // Extract relevant information from the website
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                
                // Extract key information
                const title = tempDiv.querySelector('h1')?.textContent || '';
                const description = tempDiv.querySelector('meta[name="description"]')?.content || '';
                const mainContent = tempDiv.querySelector('main')?.textContent || '';
                
                return {
                    title,
                    description,
                    mainContent: mainContent.substring(0, 500) // Limit content length
                };
            } catch (error) {
                console.error('Error fetching Elevance Health data:', error);
                // Return helpful error message for CORS issues
                if (error.message.includes('CORS') || error.message.includes('NetworkError')) {
                    return {
                        error: 'CORS_ERROR',
                        message: 'Cannot fetch live data due to browser security restrictions. Please run the backend server for full functionality.'
                    };
                }
                return null;
            }
        }

        // Enhanced response system with real-time website fetching
        async function generateResponse(userMessage) {
            const message = userMessage.toLowerCase();
            
            // Check if we need fresh data from the website
            if (message.includes('latest') || message.includes('current') || message.includes('recent') || message.includes('update')) {
                const freshData = await fetchElevanceHealthData();
                if (freshData) {
                    if (freshData.error === 'CORS_ERROR') {
                        return `I cannot fetch live data from the Elevance Health website due to browser security restrictions (CORS).\n\nTo enable live website fetching, please run the backend server:\n1. Install Node.js\n2. Navigate to the web-chat directory\n3. Run 'npm install'\n4. Run 'npm start'\n5. Open http://localhost:3000\n\nCurrently, I can provide pre-loaded information about Elevance Health.`;
                    }
                    return `Here's the latest information from Elevance Health:\n\n${freshData.description}\n\nKey content: ${freshData.mainContent}`;
                }
            }
            
            // Greeting responses
            if (message.includes('hello') || message.includes('hi') || message.includes('hey')) {
                return `Hello! I'm the Anthem Guide agent, specialized in Elevance Health web guide development. I can help you with information about ${anthemGuideKnowledge.companyInfo.name} and their mission to "${anthemGuideKnowledge.companyInfo.purpose}".\n\nNote: I'm currently running in standalone mode. For full functionality including live website fetching from Elevance Health, please run the backend server with Node.js. How can I assist you today?`;
            }
            
            // Help responses
            if (message.includes('help') || message.includes('what can you do')) {
                return `I can help you with:\n• ${anthemGuideKnowledge.expertise.join('\n• ')}\n\nMy capabilities include:\n• ${anthemGuideKnowledge.capabilities.join('\n• ')}\n\nI have access to real information about Elevance Health including their services, programs, and approach to whole health. I can also fetch real-time data from their website when you ask for "latest" or "current" information.`;
            }
            
            // Contact information
            if (message.includes('contact') || message.includes('email') || message.includes('reach')) {
                return `For any inquiries about the Anthem Guide agent, you can contact: ${anthemGuideKnowledge.contact}\n\nFor Elevance Health corporate information, visit their official website at ${anthemGuideKnowledge.knowledgeBase}`;
            }
            
            // Company information
            if (message.includes('elevance') || message.includes('company') || message.includes('about') || message.includes('who')) {
                return `${anthemGuideKnowledge.companyInfo.name} is ${anthemGuideKnowledge.companyInfo.description}. Their bold purpose is "${anthemGuideKnowledge.companyInfo.purpose}" and they focus on "${anthemGuideKnowledge.companyInfo.mission}".\n\nTheir approach: ${anthemGuideKnowledge.companyInfo.approach}.\n\nFor the most current information, ask me to fetch the latest data from their website.`;
            }
            
            // Services information
            if (message.includes('service') || message.includes('offer') || message.includes('provide')) {
                return `Elevance Health offers comprehensive health solutions including:\n• ${anthemGuideKnowledge.services.join('\n• ')}\n\nThey focus on a whole health approach that serves people across their entire health journey.`;
            }
            
            // Key focus areas
            if (message.includes('focus') || message.includes('area') || message.includes('approach')) {
                return `Elevance Health's key focus areas include:\n• ${anthemGuideKnowledge.keyFocusAreas.join('\n• ')}\n\nThese areas reflect their commitment to elevating whole health and advancing health beyond healthcare.`;
            }
            
            // Research information
            if (message.includes('research') || message.includes('study') || message.includes('data')) {
                return `Elevance Health conducts research in several key areas:\n• ${anthemGuideKnowledge.researchAreas.join('\n• ')}\n\nTheir research supports their commitment to innovation and pursuit of moving health forward.`;
            }
            
            // Programs and initiatives
            if (message.includes('program') || message.includes('initiative') || message.includes('project')) {
                return `Elevance Health runs several important programs:\n• ${anthemGuideKnowledge.programs.join('\n• ')}\n\nFor example, the Community Pharmacy Total Care (CPTC) program connects members with complex health conditions to independent community pharmacies for personalized care.`;
            }
            
            // Whole health information
            if (message.includes('whole health') || message.includes('holistic') || message.includes('comprehensive')) {
                return `Elevance Health's whole health approach serves people across their entire health journey and addresses their full range of needs with an integrated approach. This includes physical, behavioral, social, and community health factors that influence overall well-being.`;
            }
            
            // Community health
            if (message.includes('community') || message.includes('social') || message.includes('local')) {
                return `Community health plays a crucial role in Elevance Health's approach. They focus on how neighborhoods, policies, and opportunities shape health outcomes. Their initiatives include community pharmacies, health equity programs, and partnerships with local organizations to strengthen communities.`;
            }
            
            // Website information
            if (message.includes('website') || message.includes('resource') || message.includes('reference') || message.includes('link')) {
                return `The official Elevance Health website is available at: ${anthemGuideKnowledge.knowledgeBase}\n\nThere you can find detailed information about their services, research, stories, and approach to whole health.\n\nI can also fetch real-time content from their website if you need the most current information.`;
            }
            
            // Web guide specific
            if (message.includes('web guide') || message.includes('guide') || message.includes('documentation')) {
                return `I specialize in web guide development for Elevance Health. I can help with creating guides that accurately reflect their services like ${anthemGuideKnowledge.services.slice(0, 3).join(', ')}, and their focus on ${anthemGuideKnowledge.keyFocusAreas[0]}. What specific aspect would you like assistance with?`;
            }
            
            // Healthcare compliance
            if (message.includes('compliance') || message.includes('hipaa') || message.includes('regulatory')) {
                return "I ensure all content meets healthcare industry standards, HIPAA compliance where applicable, and Elevance Health's specific policies. This includes accuracy in healthcare information, proper documentation, and stakeholder coordination for content approval.";
            }
            
            // Technical implementation
            if (message.includes('technical') || message.includes('html') || message.includes('css') || message.includes('javascript')) {
                return "I can assist with technical implementation including HTML, CSS, JavaScript, and frontend frameworks for web guide development. I also help with testing across different browsers and devices to ensure optimal user experience.";
            }
            
            // Default response with company context
            return `I'm here to help with Elevance Health web guide development and can provide information about ${anthemGuideKnowledge.companyInfo.name} and their services. I can assist with web guide development, content management, technical implementation, user experience optimization, and healthcare compliance.\n\nNote: I'm currently running in standalone mode. For full functionality including live website fetching from Elevance Health, please run the backend server with Node.js. In standalone mode, I provide pre-loaded information. Would you like to know more about their services, approach to health, or specific web guide development assistance?`;
        }

        // Add message to chat
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            // Handle line breaks in responses
            const formattedContent = content.replace(/\n/g, '<br>');
            messageContent.innerHTML = `<p>${formattedContent}</p>`;
            
            messageDiv.appendChild(messageContent);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing-indicator-container';
            typingDiv.id = 'typingIndicator';
            
            const typingContent = document.createElement('div');
            typingContent.className = 'typing-indicator';
            typingContent.innerHTML = '<span></span><span></span><span></span>';
            
            typingDiv.appendChild(typingContent);
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Send message
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, true);
            userInput.value = '';
            
            // Disable input while processing
            userInput.disabled = true;
            sendButton.disabled = true;
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                // Generate and add bot response (now async for website fetching)
                const response = await generateResponse(message);
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Add bot response
                addMessage(response);
            } catch (error) {
                console.error('Error generating response:', error);
                removeTypingIndicator();
                addMessage('Sorry, I encountered an error processing your request. Please try again.');
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
